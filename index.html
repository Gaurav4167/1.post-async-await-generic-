    <meta charset="UTF-8">

        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Post Crud</title>
</head>

<body>

    <div class="container-fluid">
        <div class="row top-Heading">
            <div class="col-md-6 offset-md-3">
                <header class="text-center ">
                    <h1 class="mt-3">📄 Post Management</h1>
                    <p>Create &nbsp; · &nbsp; Read &nbsp; · &nbsp; Update &nbsp; · &nbsp; Delete</p>
                </header>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row mt-4">
            <div class="col-md-4 offset-md-4">
                <h4 class="text-center">Add New Post</h4>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <form id="postForm">
                            <div class="form-container">

                                <label class="label" for="title"><b>Title</b></label>
                                <input class="form-control mb-4" type="text" id="title" name="title"
                                    placeholder="Enter post title" required>

                                <label class="label" for="content"><b>Content</b></label>
                                <textarea class="form-control mb-4" id="content" name="content"
                                    placeholder="Enter post content..." required></textarea>

                            </div>

                            <button id="addBtn" type="submit" class="btn btn-primary"> Create Post </button>
                            <button id="updateBtn" type="button" class="btn btn-primary d-none"> Update Post </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

                    </div>
                </div>
            </div>
        </div> -->
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h2>All Posts</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <table class="table">
                    <thead class="thead">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Content</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tbody">
                        <!-- <tr>
                            <td>1</td>
                            <td>First Post</td>

                            <td>2026-10-20</td>
                            <td>
                                <div class="actions">
                                    <button id="editBtn" type="button" class="btn btn-warning"> Edit </button>
                                    <button id="deleteBtn" type="button" class="btn btn-danger"> Delete </button>
                                </div>
                            </td>
                        </tr> -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
